<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">



<meta

  name="viewport"

  content="width=device-width,initial-scale=1.0,viewport-fit=cover"

>



<title>CEZOO Vendor</title>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<style>



*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}



html,

body{

  width:100%;

  min-height:100%;

}



body{

  min-height:100dvh;

  font-family:Arial,sans-serif;

  background:#fff;

}





/* =========================

   LOGIN PAGE

========================= */



.loginPage{

  width:100%;

  min-height:100dvh;

  background:#fff;

}





/* TOP IMAGE */



.loginTop{

  width:100%;

  height:48dvh;

  min-height:350px;



  background:#eef4fb;



  display:flex;

  align-items:center;

  justify-content:center;



  overflow:hidden;



  padding:15px 8px 0;



  transition:.25s ease;

}



.loginTop img{

  width:115%;

  max-width:430px;



  height:115%;

  max-height:430px;



  object-fit:contain;

  display:block;



  transform:translateY(35px);

}





/* LOGIN AREA */



.loginBottom{

  position:relative;



  width:100%;

  min-height:52dvh;



  margin-top:-28px;



  padding:

    48px

    30px

    calc(35px + env(safe-area-inset-bottom));



  background:#fff;



  border-radius:32px 32px 0 0;



  z-index:2;



  transition:.25s ease;

}





/* TITLE */



.loginTitle{

  margin:0 0 30px;



  text-align:center;



  color:#685cff;



  font-size:32px;

  font-weight:900;

}





/* INPUT */



.loginInput{

  display:block;



  width:100%;

  height:55px;



  margin-bottom:15px;



  padding:0 20px;



  border:2px solid #e4e9f1;

  border-radius:25px;



  background:#fff;



  color:#222;



  font-size:15px;



  outline:none;



  -webkit-appearance:none;

  appearance:none;

}



.loginInput::placeholder{

  color:#777;

}



.loginInput:focus{

  border-color:#685cff;



  box-shadow:

    0 0 0 3px

    rgba(104,92,255,.08);

}





/* BUTTON */



.loginButton{

  width:100%;

  height:54px;



  margin-top:2px;



  border:0;

  border-radius:25px;



  background:

    linear-gradient(

      90deg,

      #675cff,

      #7163ff

    );



  color:#fff;



  font-size:16px;

  font-weight:700;



  cursor:pointer;



  box-shadow:

    0 7px 18px

    rgba(103,92,255,.20);

}



.loginButton:active{

  transform:scale(.97);

}



.loginButton:disabled{

  opacity:.6;

}





/* ERROR */



.loginMessage{

  display:none;



  margin-top:14px;



  text-align:center;



  color:#e54848;



  font-size:13px;

  font-weight:600;

}



.loginMessage.error{

  display:block;

}





/* =========================

   KEYBOARD OPEN

========================= */



body.keyboard-open .loginTop{

  height:0;

  min-height:0;



  padding:0;



  opacity:0;



  pointer-events:none;

}



body.keyboard-open .loginTop img{

  display:none;

}

/* =========================

   KEYBOARD OPEN — HALF MOVE ONLY

========================= */



body.keyboard-open .loginTop{

  height:24dvh;

  min-height:170px;



  padding:0 8px;



  opacity:1;



  pointer-events:none;



  overflow:hidden;

}





/* image half paiki slide */

body.keyboard-open .loginTop img{

  display:block;



  width:105%;

  height:280px;



  object-fit:contain;



  transform:translateY(-55px);

}





/* login sheet konchem matrame paiki */

body.keyboard-open .loginBottom{

  min-height:auto;



  margin-top:-25px;



  padding-top:30px;



  border-radius:32px 32px 0 0;

}





body.keyboard-open .loginTitle{

  margin-bottom:22px;

}





/* =========================

   MAIN UI

========================= */







/* SMALL MOBILE */



@media(max-width:380px){



  .loginTop{

    height:46dvh;

    min-height:320px;

  }



  .loginTop img{

    width:120%;

    height:120%;



    transform:translateY(32px);

  }



  .loginBottom{

    padding-left:24px;

    padding-right:24px;

  }



}

/* =====================================

   MAIN UI

===================================== */



#mainUI{

  display:none;



  width:100%;

  min-height:100dvh;



  background:#fff;



  padding-bottom:

    calc(105px + env(safe-area-inset-bottom));

}





.vendorMainContent{

  width:100%;

  min-height:100dvh;

}





.vendorPage{

  display:none;



  width:100%;

  min-height:

    calc(100dvh - 100px);

}





.vendorPage.active{

  display:block;

}







/* =====================================

   PROFILE PAGE

===================================== */



.profilePage{

  padding:

    calc(35px + env(safe-area-inset-top))

    25px

    35px;



  background:#fff;

}







/* PROFILE TOP */



.profileTop{

  display:flex;

  align-items:center;



  gap:14px;



  padding:

    10px 3px 18px;

}







/* AVATAR */



.profileAvatar{
  width:76px;
  height:76px;
  flex:0 0 76px;
  border-radius:50%;
  overflow:hidden;
  background:#f2f2f2;
}

.profileAvatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}





.profileTopInfo{

  flex:1;

  min-width:0;

}





.profileTopInfo h2{

  margin:0 0 7px;



  color:#111;



  font-size:18px;

  font-weight:800;



  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}





.profileTopInfo p{

  margin:0 0 10px;



  color:#444;



  font-size:14px;

}



















/* =====================================

   PROFILE DETAILS

===================================== */



.profileMenu{

  width:100%;



  border-top:1px solid #ededed;

  border-bottom:1px solid #ededed;

}





.profileMenuItem{

  min-height:56px;



  display:flex;

  align-items:center;



  gap:12px;



  padding:7px 3px;



  border-bottom:1px solid #f0f0f0;

}





.profileMenuItem:last-child{

  border-bottom:0;

}







/* ICON */



.profileMenuIcon{

  width:27px;



  flex:0 0 27px;



  display:flex;

  align-items:center;

  justify-content:center;



  color:#171717;

}





.profileMenuIcon svg{

  width:22px;

  height:22px;



  fill:none;



  stroke:currentColor;

  stroke-width:1.8;



  stroke-linecap:round;

  stroke-linejoin:round;

}







/* CONTENT */



.profileMenuContent{

  flex:1;

  min-width:0;

}





.profileMenuContent span{

  display:block;



  margin-bottom:5px;



  color:#999;



  font-size:11px;

  font-weight:500;

}





.profileMenuContent strong{

  display:block;



  color:#171717;



  font-size:15px;

  font-weight:600;



  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}







/* =====================================

   LOGOUT

===================================== */



.profileLogout{

  width:100%;

  height:52px;



  margin-top:7px;



  padding:0 3px;



  border:0;

  background:transparent;



  display:flex;

  align-items:center;



  gap:17px;



  color:#e53935;



  font-size:15px;

  font-weight:600;



  cursor:pointer;

}





.logoutIcon{

  width:27px;



  display:flex;

  align-items:center;

  justify-content:center;

}





.logoutIcon svg{

  width:22px;

  height:22px;



  fill:none;



  stroke:currentColor;

  stroke-width:1.9;



  stroke-linecap:round;

  stroke-linejoin:round;

}





.profileArrow{

  margin-left:auto;



  color:#999;



  font-size:25px;

  font-weight:300;

}







/* =====================================

   FLOATING BOTTOM NAV

===================================== */



.floatingVendorNav{

  position:fixed;



  left:16px;

  right:16px;



  bottom:

    calc(13px + env(safe-area-inset-bottom));



  height:72px;



  padding:7px;



  display:flex;

  align-items:center;



  background:

    rgba(255,255,255,.96);



  border:

    1px solid #ececf2;



  border-radius:25px;



  box-shadow:

    0 10px 32px

    rgba(20,22,35,.13);



  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);



  z-index:999;

}







/* NAV BUTTON */



.vendorNavItem{

  flex:1;



  height:57px;



  border:0;

  border-radius:18px;



  background:transparent;



  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;



  gap:4px;



  color:#999ca6;



  cursor:pointer;



  transition:.18s ease;

}





.vendorNavItem svg{

  width:22px;

  height:22px;



  fill:none;



  stroke:currentColor;

  stroke-width:1.9;



  stroke-linecap:round;

  stroke-linejoin:round;

}





.vendorNavItem span{

  font-size:10px;

  font-weight:700;

}







/* ACTIVE */



.vendorNavItem.active{

  background:#f0efff;



  color:#685cff;

}





.vendorNavItem:active{

  transform:scale(.94);

}







/* =====================================

   SMALL MOBILE

===================================== */



@media(max-width:380px){



  .profilePage{

    padding-left:20px;

    padding-right:20px;

  }





  .profileAvatar{
    width:70px;
    height:70px;
    flex-basis:70px;
  }





  .profileTop{

    gap:17px;

  }





  .profileTopInfo h2{

    font-size:18px;

  }





  



}


/* =====================================
   APP PRELOAD / SESSION RESTORE
===================================== */

#appPreloader{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  transition:opacity .22s ease, visibility .22s ease;
}

#appPreloader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.appPreloadSpinner{
  width:34px;
  height:34px;

  border:3px solid #ecebff;
  border-top-color:#685cff;
  border-radius:50%;

  animation:cezooPreloadSpin .72s linear infinite;
}

@keyframes cezooPreloadSpin{
  to{ transform:rotate(360deg); }
}


/* PROFILE PRODUCT STATS */
.profileStats{
  width:100%;
  margin:4px 0 14px;
  padding:14px 8px;
  display:flex;
  align-items:center;
  background:#f8f8fb;
  border-radius:16px;
}
.profileStatBox{
  flex:1;
  text-align:center;
}
.profileStatBox span{
  display:block;
  margin-bottom:5px;
  color:#8d8d95;
  font-size:11px;
  font-weight:600;
}
.profileStatBox strong{
  display:block;
  color:#171717;
  font-size:20px;
  font-weight:800;
}
.profileStatDivider{
  width:1px;
  height:32px;
  background:#e5e5ea;
}


/* =====================================
   PRODUCTS PAGE
===================================== */

.productsPageWrap{
  padding:
    calc(22px + env(safe-area-inset-top))
    16px
    20px;
}

.productsPageTitle{
  margin:0 0 16px;
  font-size:24px;
  font-weight:900;
  color:#171717;
}

.vendorProductsGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.vendorProductCard{
  min-width:0;
  padding:10px;
  background:#fff;
  border:1px solid #eeeeF3;
  border-radius:16px;
}

.vendorProductImage{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  background:#f7f7f8;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.vendorProductImage img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.vendorProductName{
  margin-top:9px;
  color:#1d1d1f;
  font-size:13px;
  font-weight:800;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vendorProductMeta{
  margin-top:4px;
  color:#8d8d94;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vendorProductPrice{
  margin-top:7px;
  color:#171717;
  font-size:14px;
  font-weight:900;
}

.vendorProductOldPrice{
  margin-left:5px;
  color:#aaa;
  font-size:11px;
  font-weight:500;
  text-decoration:line-through;
}

.vendorProductsState{
  grid-column:1/-1;
  padding:55px 15px;
  text-align:center;
  color:#999;
  font-size:13px;
}


/* =====================================
   PRODUCTS INFINITE SCROLL
===================================== */
.vendorProductsLoadMore{
  grid-column:1/-1;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.vendorProductsLoadMore.hidden{
  display:none;
}

.vendorProductsSpinner{
  width:27px;
  height:27px;
  border:3px solid #ecebff;
  border-top-color:#685cff;
  border-radius:50%;
  animation:vendorProductsSpin .7s linear infinite;
}

@keyframes vendorProductsSpin{
  to{ transform:rotate(360deg); }
}


/* =====================================
   VENDOR PRODUCT PRICE + INLINE EDIT
===================================== */
.vendorProductPriceBlock{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #f0f0f3;
}

.vendorProductPriceRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:4px;
}

.vendorProductPriceLabel{
  color:#8d8d94;
  font-size:10px;
  font-weight:600;
}

.vendorProductPriceValue{
  color:#171717;
  font-size:13px;
  font-weight:800;
}

.vendorProductPriceValue.discount{
  color:#685cff;
}

.vendorProductEditBtn{
  width:100%;
  height:34px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:#f0efff;
  color:#685cff;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.vendorProductEditBox{
  margin-top:9px;
  padding:9px;
  background:#f8f8fb;
  border-radius:11px;
}

.vendorProductEditField{
  margin-bottom:8px;
}

.vendorProductEditField:last-of-type{
  margin-bottom:0;
}

.vendorProductEditField label{
  display:block;
  margin-bottom:4px;
  color:#8d8d94;
  font-size:9px;
  font-weight:700;
}

.vendorProductEditField input{
  width:100%;
  height:35px;
  padding:0 10px;
  border:1px solid #e1e1e7;
  border-radius:9px;
  outline:none;
  background:#fff;
  color:#171717;
  font-size:12px;
  font-weight:700;
}

.vendorProductEditField input:focus{
  border-color:#685cff;
}

.vendorProductEditActions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.vendorProductCancelBtn,
.vendorProductSaveBtn{
  flex:1;
  height:34px;
  border:0;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.vendorProductCancelBtn{
  background:#ececf1;
  color:#555;
}

.vendorProductSaveBtn{
  background:#685cff;
  color:#fff;
}

.vendorProductSaveBtn:disabled{
  opacity:.6;
}

.vendorProductSaveStatus{
  min-height:14px;
  margin-top:6px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  color:#e54848;
}

.vendorProductSaveStatus:empty{
  display:none;
}

.vendorProductSaveBtn.saved{
  background:#24a15b;
}

.vendorProductSaveBtn .saveTick{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  line-height:1;
  font-weight:900;
}


/* =====================================
   PRODUCT IMAGE — ON / OFF TOGGLE
===================================== */
.vendorProductImage{
  position:relative;
}

.vendorProductStockToggle{
  position:absolute;
  top:8px;
  right:8px;
  z-index:4;

  width:50px;
  height:25px;
  padding:0;

  border:0;
  border-radius:999px;

  background:#dedee4;

  display:flex;
  align-items:center;

  cursor:pointer;
  -webkit-tap-highlight-color:transparent;

  box-shadow:0 2px 7px rgba(0,0,0,.10);
  transition:background .18s ease, opacity .18s ease;
}

.vendorProductStockToggle::before{
  content:"";
  position:absolute;

  left:3px;
  top:3px;

  width:19px;
  height:19px;

  border-radius:50%;
  background:#fff;

  box-shadow:0 1px 4px rgba(0,0,0,.18);

  transition:transform .18s ease;
}

.vendorProductStockToggle.on{
  background:#28b463;
}

.vendorProductStockToggle.on::before{
  transform:translateX(25px);
}

.vendorProductStockToggleText{
  position:absolute;
  left:24px;
  right:3px;

  color:#666;
  font-size:8px;
  font-weight:900;
  text-align:center;
  line-height:25px;

  pointer-events:none;
}

.vendorProductStockToggle.on .vendorProductStockToggleText{
  left:3px;
  right:24px;
  color:#fff;
}

.vendorProductStockToggle.saving{
  opacity:.55;
  pointer-events:none;
}


/* =====================================
   PRODUCTS — SEARCH + STOCK FILTER
===================================== */
.vendorProductsTools{
  width:100%;
  margin:-3px 0 14px;
}

.vendorProductsSearchWrap{
  position:relative;
  width:100%;
}

.vendorProductsSearchIcon{
  position:absolute;
  left:14px;
  top:50%;
  width:18px;
  height:18px;
  transform:translateY(-50%);
  color:#8f9098;
  pointer-events:none;
}

.vendorProductsSearchInput{
  width:100%;
  height:46px;
  padding:0 42px 0 43px;
  border:1px solid #e9e9ef;
  border-radius:15px;
  outline:none;
  background:#f7f7f9;
  color:#171717;
  font-size:13px;
  font-weight:600;
  -webkit-appearance:none;
  appearance:none;
}

.vendorProductsSearchInput:focus{
  background:#fff;
  border-color:#cbc8ff;
  box-shadow:0 0 0 3px rgba(104,92,255,.07);
}

.vendorProductsSearchInput::placeholder{
  color:#a0a0a7;
  font-weight:500;
}

.vendorProductsSearchClear{
  position:absolute;
  right:8px;
  top:50%;
  width:30px;
  height:30px;
  transform:translateY(-50%);
  border:0;
  border-radius:50%;
  background:transparent;
  color:#999;
  font-size:19px;
  line-height:30px;
  text-align:center;
  cursor:pointer;
  display:none;
}

.vendorProductsSearchClear.show{
  display:block;
}

.vendorProductsFilters{
  display:flex;
  gap:8px;
  margin-top:10px;
  overflow-x:auto;
  scrollbar-width:none;
}

.vendorProductsFilters::-webkit-scrollbar{
  display:none;
}

.vendorProductsFilterBtn{
  flex:0 0 auto;
  height:34px;
  padding:0 14px;
  border:1px solid #e8e8ed;
  border-radius:999px;
  background:#fff;
  color:#777980;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:.16s ease;
}

.vendorProductsFilterBtn.active{
  border-color:#685cff;
  background:#685cff;
  color:#fff;
}

.vendorProductsFilterBtn:active{
  transform:scale(.96);
}

const SUPABASE_URL =

"https://ycqwdeiykbkfmmlpgdzd.supabase.co";





const SUPABASE_KEY =

"sb_publishable_-4RzQVudUy_VsvSpHTxNfg_hrdsQW0j";





const sb =

window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);







/* =============================

   ELEMENTS

============================= */



const loginPage =

document.getElementById(

  "loginPage"

);





const mainUI =

document.getElementById(

  "mainUI"

);





const loginForm =

document.getElementById(

  "loginForm"

);





const mobile =

document.getElementById(

  "mobile"

);





const password =

document.getElementById(

  "password"

);





const loginBtn =

document.getElementById(

  "loginBtn"

);





const message =

document.getElementById(

  "message"

);
let currentVendor = null;


/* =====================================
   ANDROID FCM TOKEN RECEIVER
   Same flow as previous CEZOO Vendor code
===================================== */

let cezooFcmToken =
  String(
    localStorage.getItem("cezoo_fcm_token") || ""
  ).trim();

function cleanFcmToken(token){
  return String(token ?? "").trim();
}

async function saveVendorFcmToken(){

  if(
    !currentVendor ||
    !currentVendor.mobile ||
    !cezooFcmToken
  ){
    return;
  }

  try{

    const mobileValue =
      String(currentVendor.mobile)
        .replace(/\D/g,"")
        .slice(-10);

    if(mobileValue.length !== 10){
      console.warn(
        "FCM token save skipped: invalid vendor mobile"
      );
      return;
    }

    /* Save token in logged-in vendor_login row */
    const {
      error:vendorError
    } =
    await sb
      .from("vendor_login")
      .update({
        fcm_token:cezooFcmToken,
        fcm_token_updated_at:new Date().toISOString()
      })
      .eq("id",currentVendor.id);

    if(vendorError){
      console.error(
        "Vendor FCM token save error:",
        vendorError
      );
    }

    /* Keep existing device-token table in sync too */
    const {
      error:deviceError
    } =
    await sb
      .from("delivery_partner_device_tokens")
      .upsert(
        {
          mobile:mobileValue,
          device_token:cezooFcmToken,
          updated_at:new Date().toISOString()
        },
        {
          onConflict:"mobile"
        }
      );

  if(String(table||"").toLowerCase()==="juttigastore"){

async function resolveActualVendorId(){
  if(!currentVendor) return null;

  const loginMobile=String(currentVendor.mobile||"")
    .replace(/\D/g,"")
    .slice(-10);

  if(!loginMobile) return null;

  try{
    const {data,error}=await sb
      .from("vendors")
      .select("id,vendor_name,mobile")
      .limit(200);

    if(error) throw error;

    const matched=(data||[]).find(v=>
      String(v.mobile||"").replace(/\D/g,"").slice(-10)===loginMobile
    );

    currentVendor._actual_vendor_id=matched?.id ?? null;

    console.log("CEZOO vendor mapping",{
      login_id:currentVendor.id,
      actual_vendor_id:currentVendor._actual_vendor_id,
      mobile:loginMobile
    });

    return currentVendor._actual_vendor_id;
  }catch(error){
    console.error("Vendor mapping error:",error);
    currentVendor._actual_vendor_id=null;
    return null;
  }
}


function escapeVendorHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function isVendorProductOutOfStock(product){
  return !isVendorProductOn(product);
}


async function fetchLoggedVendorProducts(){

  const jobs =
    PRODUCT_TABLES.map(
      async table => {

        try{

          const vendorId=getVendorProductId(table);

          if(vendorId == null){
            console.warn("Vendor id not resolved for table:",table);
            return [];
          }

          const {
            data,
            error
          } =
          await sb
            .from(table)
            .select("*")
            .eq(
              "vendor_id",
              vendorId
            );

          if(error){
            console.warn(
              "Product table:",
              table,
              error.message
            );
            return [];
          }

          return (data || []).map(
            product => ({
              ...product,
              _table:table
            })
          );

        }catch(error){

          console.warn(
            "Product load:",
            table,
            error
          );

          return [];
        }

      }
    );

  const results =
    await Promise.all(jobs);

  return results.flat();
}

async function toggleVendorProductStock(
  table,
  productId,
  button
){
  if(!button || button.classList.contains("saving")) return;

  const product = findVendorCachedProduct(table, productId);
  if(!product) return;

  const vendorId = getVendorProductId(table);
  if(vendorId == null) return;

  const wasOn = isVendorProductOn(product);
  const nextOn = !wasOn;
  const oldStock = product.stock;

  button.classList.add("saving");
  product.stock = nextOn;
  button.classList.toggle("on", nextOn);

  const text = button.querySelector(".vendorProductStockToggleText");
  if(text) text.textContent = nextOn ? "ON" : "OFF";

  try{
    const { data, error } = await sb
      .from(table)
      .update({ stock: nextOn })
      .eq("id", productId)
      .eq("vendor_id", vendorId)
      .select("id,stock")
      .maybeSingle();

    if(error) throw error;
    if(!data) throw new Error("Stock update not allowed");

    product.stock = data.stock;
    updateProfileProductStats(vendorProductsCache);
  }catch(error){
    console.error("Product ON/OFF update:", error);
    product.stock = oldStock;
    button.classList.toggle("on", wasOn);
    if(text) text.textContent = wasOn ? "ON" : "OFF";
  }finally{
    button.classList.remove("saving");
  }
}

function findVendorCachedProduct(table, productId){
  return vendorProductsCache.find(
    p =>
      String(p._table) === String(table) &&
      String(p.id) === String(productId)
  ) || null;
}

async function saveVendorProductPrices(
  table,
  productId,
  card,
  editor,
  editButton
){

  const originalInput =
    editor.querySelector(
      ".vendorOriginalPriceInput"
    );

  const discountInput =
    editor.querySelector(
      ".vendorDiscountPriceInput"
    );

  const saveButton =
    editor.querySelector(
      ".vendorProductSaveBtn"
    );

  const status =
    editor.querySelector(
      ".vendorProductSaveStatus"
    );

  const originalText =
    String(
      originalInput?.value ?? ""
    ).trim();

  const discountText =
    String(
      discountInput?.value ?? ""
    ).trim();

  if(
    originalText === "" ||
    discountText === ""
  ){
    status.textContent =
      "Enter both prices";
    status.className =
      "vendorProductSaveStatus error";
    return;
  }

  const original =
    Number(originalText);

  const discount =
    Number(discountText);

  if(
    !Number.isFinite(original) ||
    !Number.isFinite(discount) ||
    original < 0 ||
    discount < 0
  ){
    status.textContent =
      "Enter valid prices";
    status.className =
      "vendorProductSaveStatus error";
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";
  status.textContent = "";
  status.className =
    "vendorProductSaveStatus";

  try{

    /*
      Security:
      vendor_id condition prevents this UI
      from updating another vendor's product.
    */
    const vendorId =
      getVendorProductId();

    if(vendorId == null){
      throw new Error(
        "Vendor session missing"
      );
    }

    const {
      data,
      error
    } =
    await sb
      .from(table)
      .update({
        original_price: original,
        discount_price: discount
      })
      .eq(
        "id",
        productId
      )
      .eq(
        "vendor_id",
        vendorId
      )
      .select(
        "id,original_price,discount_price"
      )
      .maybeSingle();

    if(error){
      throw error;
    }

    if(!data){
      throw new Error(
        "Price update not allowed"
      );
    }

    /* Update local cache — NO PAGE REFRESH */
    const product =
      findVendorCachedProduct(
        table,
        productId
      );

    if(product){
      product.original_price =
        data.original_price;

      product.discount_price =
        data.discount_price;
    }

    /* Update only this card — NO BLINK */
    const originalEl =
      card.querySelector(
        '[data-price-type="original"]'
      );

    const discountEl =
      card.querySelector(
        '[data-price-type="discount"]'
      );

    if(originalEl){
      originalEl.textContent =
        `₹${data.original_price}`;
    }

    if(discountEl){
      discountEl.textContent =
        `₹${data.discount_price}`;
    }

    status.textContent = "";

    saveButton.classList.add("saved");
    saveButton.innerHTML =
      '<span class="saveTick">✓</span>';

    setTimeout(()=>{
      editor.remove();
      editButton.style.display = "";
    },550);

  }catch(error){

    console.error(
      "Price update:",
      error
    );

    status.textContent =
      "Unable to save";

    status.className =
      "vendorProductSaveStatus error";

    saveButton.disabled = false;
    saveButton.textContent = "Save";
  }
}

function setupVendorProductsObserver(){

  disconnectVendorProductsObserver();

  const sentinel =
    document.getElementById(
      "vendorProductsLoadMore"
    );

  if(
    !sentinel ||
    sentinel.classList.contains("hidden")
  ){
    return;
  }

  vendorProductsObserver =
    new IntersectionObserver(
      entries=>{

        if(
          entries.some(entry=>entry.isIntersecting)
        ){
          loadNextVendorProducts();
        }

      },
      {
        root:null,
        rootMargin:"100px 0px",
        threshold:0.01
      }
    );

  vendorProductsObserver.observe(
    sentinel
  );
}



function getFilteredVendorProducts(){

  const query =
    String(vendorProductsSearchQuery || "")
      .trim()
      .toLowerCase();

  return vendorProductsCache.filter(
    product => {

      if(
        vendorProductsStockFilter === "in" &&
        isVendorProductOutOfStock(product)
      ){
        return false;
      }

      if(
        vendorProductsStockFilter === "out" &&
        !isVendorProductOutOfStock(product)
      ){
        return false;
      }

      if(vendorProductsCategoryFilter !== "all"){
        const productCategories=String(product.category||"")
          .split(",")
          .map(v=>v.trim().toLowerCase())
          .filter(Boolean);

        if(!productCategories.includes(
          String(vendorProductsCategoryFilter).trim().toLowerCase()
        )){
          return false;
        }
      }

      if(!query){
        return true;
      }

      const searchable =
        [
          product.product_name,
          product.name,
          product.name_telugu,
          product.brand,
          product.category,
          product.category_name,
          product.sub_category,
          product.subcategory,
          product.id,
          product.quantity,
          product.unit
        ]
        .filter(
          value =>
            value !== undefined &&
            value !== null
        )
        .join(" ")
        .toLowerCase();

      return searchable.includes(query);
    }
  );
}

function renderVendorProductCategories(){
  const root=document.getElementById("vendorProductsCategories");
  if(!root)return;

  const preferred=[
    "Groceries","Daily Use","Cleaning","Biscuits","Powders","Shampoos",
    "Oral Care","Dry Fruits","Cool Drinks","Snacks","Lays","Chocolates",
    "Instant Foods","Stationary","Soaps","Personal Care","Baby Care",
    "Pooja Items","Oils","Skincare","Brushes","Gifts","Pindi"
  ];

  const found=new Map();

  vendorProductsCache.forEach(product=>{
    // Categories are read from the real DB `category` column.
    // This avoids guessing from product name/table.
    String(product.category||"")
      .split(",")
      .map(v=>v.trim())
      .filter(Boolean)
      .forEach(cat=>{
        const key=cat.toLowerCase();
        if(!found.has(key))found.set(key,cat);
      });
  });

  const ordered=[];
  preferred.forEach(cat=>{
    const real=found.get(cat.toLowerCase());
    if(real){
      ordered.push(real);
      found.delete(cat.toLowerCase());
    }
  });
  ordered.push(...[...found.values()].sort((a,b)=>a.localeCompare(b)));

  // If the selected category no longer exists after login/reload, go back to All.
  if(
    vendorProductsCategoryFilter!=="all" &&
    !ordered.some(c=>c.toLowerCase()===String(vendorProductsCategoryFilter).toLowerCase())
  ){
    vendorProductsCategoryFilter="all";
  }

  root.innerHTML=
    `<button class="vendorProductsCategoryBtn ${vendorProductsCategoryFilter==="all"?"active":""}" type="button" data-category="all">All</button>`+
    ordered.map(cat=>`
      <button
        class="vendorProductsCategoryBtn ${String(vendorProductsCategoryFilter).toLowerCase()===cat.toLowerCase()?"active":""}"
        type="button"
        data-category="${orderEsc(cat)}"
      >${orderEsc(cat)}</button>
    `).join("");

  root.querySelectorAll(".vendorProductsCategoryBtn").forEach(button=>{
    button.addEventListener("click",()=>{
      vendorProductsCategoryFilter=button.dataset.category||"all";
      root.querySelectorAll(".vendorProductsCategoryBtn")
        .forEach(item=>item.classList.toggle("active",item===button));
      refreshVendorProductsView();
    });
  });
}

function renderVendorProductsInitial(){

  const grid =
    document.getElementById(
      "vendorProductsGrid"
    );

  if(!grid){
    return;
  }

  disconnectVendorProductsObserver();

  vendorProductsViewCache =
    getFilteredVendorProducts();

  if(!vendorProductsViewCache.length){

    grid.innerHTML =
      '<div class="vendorProductsState">No products found</div>';

    return;
  }

  vendorProductsVisibleCount =
    Math.min(
      PRODUCTS_PAGE_SIZE,
      vendorProductsViewCache.length
    );

  const firstProducts =
    vendorProductsViewCache.slice(
      0,
      vendorProductsVisibleCount
    );

  const hasMore =
    vendorProductsVisibleCount <
    vendorProductsViewCache.length;

  grid.innerHTML =
    firstProducts
      .map(vendorProductCardHtml)
      .join("") +
    `
      <div
        class="vendorProductsLoadMore ${hasMore ? "" : "hidden"}"
        id="vendorProductsLoadMore"
      >
        <div class="vendorProductsSpinner"></div>
      </div>
    `;

  if(hasMore){
    setupVendorProductsObserver();
  }
}


function loadNextVendorProducts(){

  if(vendorProductsLoadingMore){
    return;
  }

  if(
    vendorProductsVisibleCount >=
    vendorProductsViewCache.length
  ){
    disconnectVendorProductsObserver();
    return;
  }

  vendorProductsLoadingMore = true;

  const sentinel =
    document.getElementById(
      "vendorProductsLoadMore"
    );

  if(sentinel){
    sentinel.classList.remove("hidden");
  }

  /*
    Small delay lets the spinner be visible naturally
    while the next local batch is painted.
  */
  setTimeout(()=>{

    const grid =
      document.getElementById(
        "vendorProductsGrid"
      );

    if(!grid){
      vendorProductsLoadingMore = false;
      return;
    }

    const nextEnd =
      Math.min(
        vendorProductsVisibleCount +
        PRODUCTS_PAGE_SIZE,
        vendorProductsViewCache.length
      );

    const nextProducts =
      vendorProductsViewCache.slice(
        vendorProductsVisibleCount,
        nextEnd
      );

    if(sentinel){
      sentinel.insertAdjacentHTML(
        "beforebegin",
        nextProducts
          .map(vendorProductCardHtml)
          .join("")
      );
    }

    vendorProductsVisibleCount =
      nextEnd;

    vendorProductsLoadingMore =
      false;

    if(
      vendorProductsVisibleCount >=
      vendorProductsViewCache.length
    ){

      if(sentinel){

async function restoreLogin(){

  const id =
    localStorage.getItem(
      "cezoo_vendor_id"
    );


  /* No saved login -> show login only after preload */
  if(!id){

    loginPage.style.display =
      "block";

    mainUI.style.display =
      "none";

    hideAppPreloader();

    return;
  }


  try{

    /*
      Saved vendor exists:

    */

    const {
      data,
      error
    } =
    await Promise.race([
      sb
        .from(

        .eq(

        )
        .maybeSingle(),
      new Promise((_, reject)=>
        setTimeout(
          ()=>reject(new Error("Session restore timeout")),
          8000
        )
      )
    ]);


    if(error){
      throw error;
    }


    if(!data){

      localStorage.removeItem(
        "cezoo_vendor_id"

      loginPage.style.display =

    /*

    );

const VENDOR_ORDER_TABLES = [
  {table:"cash_delivery_orders", payment:"CASH", deliveryTable:"delivery_cash_orders"},
  {table:"upi_orders", payment:"UPI", deliveryTable:"delivery_upi_orders"}
];

let vendorPackedOrdersHistory=[];
let vendorStatusChannels=[];
let vendorStatusLastSignature="";
let vendorStatusHasLoaded=false;

function packedHistoryKey(order){
  return `${order?._deliveryTable||order?._sourceTable||""}__${order?.source_order_id??order?.order_id??order?.id??""}`;
}

function rememberPackedVendorOrder(order){
  if(!order)return;
  const copy={
    ...order,
    order_status:"packed",
    delivery_status:"assigned",
    _vendorItems:(order._vendorItems||[]).map(i=>({...i})),
    _packedDisplayAt:new Date().toISOString()
  };
  const key=packedHistoryKey(copy);
  vendorPackedOrdersHistory=vendorPackedOrdersHistory.filter(x=>packedHistoryKey(x)!==key);
  vendorPackedOrdersHistory.unshift(copy);
  renderVendorPackedHistory();
  setTimeout(()=>loadVendorStatusHistory(),300);
}

function parseDeliveryItems(value){
  if(Array.isArray(value))return value;
  if(typeof value==="string"){
    try{
      const parsed=JSON.parse(value);
      return Array.isArray(parsed)?parsed:[];
    }catch(e){}
  }
  return [];
}

/*
  STATUS SOURCE OF TRUTH:
  Read the rows that the vendor itself inserted into
  delivery_cash_orders / delivery_upi_orders.
  Do not depend on localStorage or the current page session.
*/
async function loadVendorStatusHistory(){
  const statusRoot=document.getElementById("vendorPackedHistory");
  if(statusRoot && !vendorStatusHasLoaded && !vendorPackedOrdersHistory.length){
    statusRoot.innerHTML=`
      <div class="vendorStatusLoading">
        <span class="vendorStatusSpinner"></span>
        <span>Loading order status...</span>
      </div>`;
  }

  if(!currentVendor){
    vendorPackedOrdersHistory=[];
    renderVendorPackedHistory();
    return;
  }

  const rows=[];

  for(const cfg of VENDOR_ORDER_TABLES){
    try{
      /*
        IMPORTANT:
        Some older delivery rows may not have a usable vendor_id.
        Load recent rows first, then match this vendor by:
          1) vendor_id
          2) vendor_mobile
          3) exact product_table + product_id ownership
      */
      const {data,error}=await sb
        .from(cfg.deliveryTable)
        .select("*")
        .order("created_at",{ascending:false})
        .limit(500);

      if(error){
        console.error("Vendor Status DB load failed:",cfg.deliveryTable,error);
        continue;
      }

      for(const d of (data||[])){
        const items=parseDeliveryItems(d.items);
        const matchedItems=[];
        const productMap=orderProductMap();

        for(const item of items){
          const table=orderProductTable(item);
          const pid=orderProductId(item);
          const product=(table && pid!==null && pid!==undefined)
            ? productMap.get(orderProductKey(table,pid))
            : null;

          if(product && String(product.vendor_id)===String(getVendorProductId(product._table||""))){
            matchedItems.push({...item,_product:product});
          }
        }

        const sameVendorId=
          d.vendor_id!==null && d.vendor_id!==undefined &&
          String(d.vendor_id)===String(getVendorProductId());

        const sameVendorMobile=
          String(d.vendor_mobile||"").replace(/\D/g,"").slice(-10) &&
          String(d.vendor_mobile||"").replace(/\D/g,"").slice(-10)===
          String(currentVendor.mobile||"").replace(/\D/g,"").slice(-10);

        if(!sameVendorId && !sameVendorMobile && !matchedItems.length){
          continue;
        }

        rows.push({
          ...d,
          id:d.source_order_id ?? d.id,
          _sourceTable:cfg.table,
          _deliveryTable:cfg.deliveryTable,
          _payment:cfg.payment,
          _vendorItems:matchedItems.length
            ? matchedItems
            : items.map(item=>({...item})),
          order_status:"packed",
          delivery_status:String(d.delivery_status||"assigned").toLowerCase().trim(),
          _packedDisplayAt:d.vendor_packed_at||d.sent_to_delivery_at||d.created_at
        });
      }
    }catch(e){
      console.error("Vendor Status exception:",cfg.deliveryTable,e);
    }
  }

  const seen=new Set();
  const nextHistory=rows.filter(o=>{
    const key=packedHistoryKey(o);
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });

  const nextSignature=JSON.stringify(nextHistory.map(o=>[
    packedHistoryKey(o),
    o.delivery_status||"",
    o.delivery_boy_accepted||false,
    o.delivery_boy_name||"",
    o.delivery_boy_mobile||""
  ]));

  if(nextSignature===vendorStatusLastSignature){
    vendorStatusHasLoaded=true;
    return;
  }

  vendorStatusLastSignature=nextSignature;
  vendorPackedOrdersHistory=nextHistory;
  vendorStatusHasLoaded=true;
  renderVendorPackedHistory();
}

function stopVendorStatusRealtime(){
  vendorStatusChannels.forEach(ch=>{try{sb.removeChannel(ch)}catch(e){}});
  vendorStatusChannels=[];
  vendorStatusHasLoaded=false;
  vendorStatusLastSignature="";
}

function startVendorStatusRealtime(){
  stopVendorStatusRealtime();
  if(!currentVendor)return;

  VENDOR_ORDER_TABLES.forEach(cfg=>{
    const ch=sb
      .channel(`vendor-delivery-status-${cfg.deliveryTable}-${currentVendor.id}`)
      .on("postgres_changes",{
        event:"*",
        schema:"public",
        table:cfg.deliveryTable
      },()=>{
        clearTimeout(window.__vendorStatusTimer);
        window.__vendorStatusTimer=setTimeout(loadVendorStatusHistory,450);
      })
      .subscribe();

    vendorStatusChannels.push(ch);
  });
}

let vendorLiveOrders=[];
let vendorOrderChannels=[];

function orderEsc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function orderItems(o){let v=o?.items||o?.products||o?.order_items||o?.cart_items||[];if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){v=[]}}return Array.isArray(v)?v:[]}
function orderProductTable(i){return i?.product_table||i?.table||i?.source_table||i?._table||""}
function orderProductId(i){return i?.product_id??i?.id??i?.productId??null}
function orderQty(i){const n=Number(i?.quantity??i?.qty??i?.count??1);return Number.isFinite(n)&&n>0?n:1}
function orderProductKey(t,id){return `${String(t)}__${String(id)}`}
function orderProductMap(){
  const m=new Map();
  const byId=new Map();

  vendorProductsCache.forEach(p=>{
    m.set(orderProductKey(p._table,p.id),p);

    const id=String(p?.id??"");
    if(!id)return;

    if(!byId.has(id)){
      byId.set(id,p);
    }else{
      // Same id exists in more than one vendor table, so don't use an unsafe fallback.
      byId.set(id,null);
    }
  });

  m._byProductId=byId;
  return m;
}
function orderImage(p){return p?.image1||p?.image||p?.image_url||p?.product_image||""}
function orderName(i,p){
  return (
    i?.product_name ||
    i?.name ||
    i?.title ||
    i?.productName ||
    i?.item_name ||
    i?.itemName ||
    p?.product_name ||
    p?.name ||
    p?.title ||
    p?.productName ||
    "Product"
  );
}
function orderPack(i,p){
  const direct=i?.cake_weight||i?.weight||i?.pack||i?.size||i?.variant||"";
  if(direct)return String(direct);
  const q=i?.product_quantity??p?.quantity??"", u=i?.product_unit??p?.unit??"";
  return `${q} ${u}`.trim();
}
function orderUnitPrice(i,p){
  const vals=[i?.discount_price,i?.price,i?.unit_price,i?.selling_price,p?.discount_price,p?.price,p?.original_price];
  for(const v of vals){const n=Number(v);if(Number.isFinite(n))return n}return 0;
}
function orderLineTotal(i,p){const explicit=Number(i?.line_total??i?.total_price??i?.subtotal);if(Number.isFinite(explicit)&&explicit>=0)return explicit;return orderUnitPrice(i,p)*orderQty(i)}
function orderCustomerName(o){return o?.user_name||o?.customer_name||o?.name||o?.full_name||"Customer"}
function orderCustomerMobile(o){return o?.user_mobile||o?.customer_mobile||o?.mobile||o?.phone||o?.phone_number||""}
function orderCustomerAddress(o){return o?.address||o?.delivery_address||o?.full_address||o?.customer_address||""}
function orderNumber(o){return o?.order_id||o?.order_number||o?.id||""}
function orderIsClosed(order){
  const status=String(
    order?.order_status ??
    order?.status ??
    order?.delivery_status ??
    ""
  ).trim().toLowerCase();

  // Orders page is ONLY for pre-pack states.
  // Once packed or moved to any delivery stage, it must never come back here.
  return [
    "packed",
    "delivery_boy_assigned",
    "assigned",
    "delivery_assigned",
    "delivery_accepted",
    "picked_up",
    "on_the_way",
    "out_for_delivery",
    "delivered",
    "completed",
    "cancelled",
    "canceled"
  ].includes(status);
}
function prepareLiveVendorOrder(row,cfg){
  if(!row||orderIsClosed(row))return null;
  const map=orderProductMap(), matched=[];
  orderItems(row).forEach(i=>{const t=orderProductTable(i),id=orderProductId(i);if(!t||id==null)return;const p=map.get(orderProductKey(t,id));if(p)matched.push({...i,_product:p,product_table:t,product_id:String(id)})});
  if(!matched.length)return null;
  return {...row,_sourceTable:cfg.table,_deliveryTable:cfg.deliveryTable,_payment:cfg.payment,_vendorItems:matched};
}
function upsertLiveVendorOrder(row,cfg){
  const key=`${cfg.table}__${row?.id}`;
  if(orderIsClosed(row)){
    vendorLiveOrders=vendorLiveOrders.filter(o=>`${o._sourceTable}__${o.id}`!==key);
    renderLiveVendorOrders();
    return;
  }
  const prepared=prepareLiveVendorOrder(row,cfg);
  const idx=vendorLiveOrders.findIndex(o=>`${o._sourceTable}__${o.id}`===key);
  if(!prepared){if(idx>=0)vendorLiveOrders.splice(idx,1);renderLiveVendorOrders();return}
  if(idx>=0)vendorLiveOrders[idx]=prepared;else vendorLiveOrders.push(prepared);
  vendorLiveOrders.sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));renderLiveVendorOrders();
}

const vendorAcceptedOrderKeys = new Set();

function vendorLiveOrderKey(order){
  return String(order?._sourceTable || "") + "__" + String(order?.id ?? "");
}

async function acceptLiveVendorOrder(orderKey,button){
  const key=String(orderKey);
  const order=vendorLiveOrders.find(o=>vendorLiveOrderKey(o)===key);
  if(!order)return;
  if(button){button.disabled=true;button.textContent="Accepting...";}
  try{
    const {error}=await sb.from(order._sourceTable).update({order_status:"accepted"}).eq("id",order.id);
    if(error)throw error;
    order.order_status="accepted";
    vendorAcceptedOrderKeys.add(key);
    renderLiveVendorOrders();
  }catch(e){
    console.error("Accept order DB update",e);
    if(button){button.disabled=false;button.textContent="Accept the Order";}
    alert("Unable to accept order. Please try again.");
  }
}

function renderLiveVendorOrders(){
  const box=document.getElementById("vendorOrdersDisplay");if(!box)return;
  const pendingCount=document.getElementById("vendorPendingCount");
  if(pendingCount)pendingCount.textContent=String(vendorLiveOrders.length);
  if(!vendorLiveOrders.length){
    box.className="ordersLiveState";
    box.innerHTML=`<div class="vendorEmptyCover"><img class="vendorEmptyImage" src="log.webp" alt=""></div>`;
    return
  }
  box.className="";
  box.innerHTML=vendorLiveOrders.slice(0,1).map(o=>{
    const total=o._vendorItems.reduce((sum,i)=>sum+orderLineTotal(i,i._product),0);
    const items=o._vendorItems.map(i=>{
      const p=i._product||{},q=orderQty(i),unit=orderUnitPrice(i,p),line=orderLineTotal(i,p),img=orderImage(p)||orderImage(i),pack=orderPack(i,p);
      return `<div class="vendorOrderItem"><div class="vendorOrderImageWrap"><div class="vendorOrderImage">${img?`<img src="${orderEsc(img)}" alt="${orderEsc(orderName(i,p))}">`:""}</div><div class="vendorOrderQtyBadge">×${orderEsc(q)}</div></div><div><div class="vendorOrderItemName">${orderEsc(orderName(i,p))}</div>${pack?`<div class="vendorOrderPack">${orderEsc(pack)}</div>`:""}</div><div class="vendorOrderPrice">₹${line.toFixed(2)}<span class="vendorOrderUnitPrice">₹${unit.toFixed(2)} each</span></div></div>`;
    }).join("");
    const time=o.created_at?new Date(o.created_at).toLocaleString():"";
    return `<article class="vendorOrderCard"><div class="vendorOrderTop"><div><div class="vendorOrderNo">Order #${orderEsc(orderNumber(o))}</div><div class="vendorOrderTime">${orderEsc(time)}</div></div><div class="vendorPaymentChip">${orderEsc(o._payment)}</div></div>${items}<div class="vendorCustomerBox"><div class="vendorCustomerLabel">Customer details</div><div class="vendorCustomerName">${orderEsc(orderCustomerName(o))}</div>${orderCustomerMobile(o)?`<div class="vendorCustomerLine">📞 ${orderEsc(orderCustomerMobile(o))}</div>`:""}${orderCustomerAddress(o)?`<div class="vendorCustomerLine">📍 ${orderEsc(orderCustomerAddress(o))}</div>`:""}</div><div class="vendorBillBox"><div class="vendorBillRow total"><span>Total Bill</span><strong>₹${total.toFixed(2)}</strong></div><div class="vendorBillRow vendorPaymentModeRow"><span>Mode</span><strong>${o._payment === "UPI" ? "Paid using UPI" : "Cash on Delivery"}</strong></div>${vendorAcceptedOrderKeys.has(vendorLiveOrderKey(o))
? `<div class="vendorPackSlider" data-source="${orderEsc(o._sourceTable)}" data-id="${orderEsc(o.id)}"><div class="vendorPackSliderTrack">Slide to Packed</div><button class="vendorPackSliderThumb" type="button" aria-label="Slide to mark packed">›</button></div>`
: `<button class="vendorAcceptOrderBtn" type="button" onclick="acceptLiveVendorOrder('${orderEsc(vendorLiveOrderKey(o))}',this)">Accept the Order</button>`}</div></article>`;
  }).join("");
  setupVendorPackSliders();
}
async function loadLiveVendorOrders(){
  if(!currentVendor||!vendorProductsCache.length){renderLiveVendorOrders();return}
  const all=[];
  for(const cfg of VENDOR_ORDER_TABLES){
    const {data,error}=await sb.from(cfg.table).select("*").order("created_at",{ascending:false}).limit(100);
    if(error){console.warn("Order load",cfg.table,error.message);continue}
    (data||[]).forEach(row=>{const p=prepareLiveVendorOrder(row,cfg);if(p)all.push(p)})
  }
  vendorLiveOrders=all.sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));renderLiveVendorOrders();
}
function stopVendorOrders(){vendorOrderChannels.forEach(ch=>{try{sb.removeChannel(ch)}catch(e){}});vendorOrderChannels=[];vendorLiveOrders=[];stopVendorStatusRealtime()}
async function startVendorOrders(){
  stopVendorOrders();await loadLiveVendorOrders();
  startVendorStatusRealtime();
  VENDOR_ORDER_TABLES.forEach(cfg=>{const ch=sb.channel(`vendor-orders-${cfg.table}-${currentVendor?.id||"x"}`).on("postgres_changes",{event:"*",schema:"public",table:cfg.table},payload=>{if(payload.eventType==="DELETE"){vendorLiveOrders=vendorLiveOrders.filter(o=>!(o._sourceTable===cfg.table&&String(o.id)===String(payload.old?.id)));renderLiveVendorOrders()}else upsertLiveVendorOrder(payload.new,cfg)}).subscribe();vendorOrderChannels.push(ch)})
}
async function autoSendToDelivery(order){
  const deliveryTable=order._deliveryTable;
  if(!deliveryTable)throw new Error("Delivery table not found");

  /*
    Keep the customer order number for delivery app matching,
    but NEVER copy the source table primary-key `id`.
  */
  const customerOrderId=String(order.order_id ?? order.order_number ?? order.id ?? "");

  const payload={...order};

  delete payload.id;
  delete payload._sourceTable;
  delete payload._orderType;
  delete payload._payment;
  delete payload._deliveryTable;
  delete payload._vendorStatus;
  delete payload._sentToDelivery;
  delete payload._vendorItems;

  payload.order_id=customerOrderId;
  payload.source_order_id=String(order.id ?? order.order_id ?? "");
  payload.source_order_type=order._sourceTable==="upi_orders" ? "upi" : "cash";
  payload.sent_to_delivery_at=new Date().toISOString();

  /*
    Delivery Partner app specifically loads:
      delivery_boy_accepted = false
      delivery_status = assigned
  */
  payload.delivery_status="assigned";
  payload.delivery_boy_accepted=false;

  payload.vendor_id=getVendorProductId();
  payload.vendor_name=currentVendor.vendor_name||currentVendor.name||"";
  payload.vendor_mobile=currentVendor.mobile||"";
  payload.vendor_packed_at=new Date().toISOString();

  payload.items=(order._vendorItems||[]).map(item=>{
    const clean={...item};
    delete clean._product;
    return clean;
  });

  /*
    If this vendor/order was already sent, do not insert it again.
    Do not depend on delivery-table primary key for duplicate detection.
  */
  let existing=null;
  try{
    const check=await sb
      .from(deliveryTable)
      .select("id")
      .eq("source_order_id",String(order.id ?? order.order_id ?? ""))
      .eq("vendor_id",getVendorProductId())
      .limit(1);

    if(!check.error)existing=check.data;
  }catch(e){
    console.warn("Delivery duplicate check:",e);
  }

  if(existing&&existing.length)return existing[0];

  /*
    Source order tables can have extra columns not present in delivery tables.
    Remove only unsupported columns reported by PostgREST and retry.
  */
  const safe={...payload};

  for(let attempt=0;attempt<50;attempt++){
    const {data,error}=await sb
      .from(deliveryTable)
      .insert(safe)
      .select("*")
      .maybeSingle();

    if(!error)return data||safe;

    const msg=String(error.message||"");

    const missing=
      msg.match(/Could not find the ['"]([^'"]+)['"] column/i) ||
      msg.match(/column ['"]?([^'".\s]+)['"]? .*does not exist/i);

    if(missing?.[1] && Object.prototype.hasOwnProperty.call(safe,missing[1])){
      delete safe[missing[1]];
      console.warn(`Delivery table missing "${missing[1]}"; retrying without it.`);
      continue;
    }

    /*
      If old bad code already inserted the same delivery order,
      treat that as already sent instead of blocking Packed.
    */
    if(error.code==="23505" || /duplicate key value/i.test(msg)){
      const byOrder=await sb
        .from(deliveryTable)
        .select("*")
        .eq("order_id",customerOrderId)
        .limit(1);

      if(!byOrder.error && byOrder.data?.length){
        return byOrder.data[0];
      }
    }

    throw error;
  }

  throw new Error("Could not create delivery order");
}
async function insertPackedDelivery(order){return autoSendToDelivery(order);}

function setupVendorPackSliders(){
  document.querySelectorAll(".vendorPackSlider").forEach(slider=>{
    if(slider.dataset.ready==="1")return;
    slider.dataset.ready="1";
    const thumb=slider.querySelector(".vendorPackSliderThumb");
    let dragging=false,startX=0,startLeft=0,max=0;
    const pos=()=>{const tr=getComputedStyle(thumb).transform;if(!tr||tr==="none")return 0;const m=tr.match(/matrix\([^,]+,[^,]+,[^,]+,[^,]+,\s*([^,]+)/);return m?Number(m[1])||0:0};
    const reset=()=>{thumb.style.transform="translateX(0px)";slider.classList.remove("dragging")};
    thumb.addEventListener("pointerdown",e=>{if(slider.classList.contains("done"))return;dragging=true;slider.classList.add("dragging");thumb.setPointerCapture(e.pointerId);startX=e.clientX;startLeft=pos();max=Math.max(0,slider.clientWidth-thumb.offsetWidth-10);e.preventDefault()});
    thumb.addEventListener("pointermove",e=>{if(!dragging)return;const x=Math.max(0,Math.min(max,startLeft+e.clientX-startX));thumb.style.transform=`translateX(${x}px)`});
    const finish=async e=>{if(!dragging)return;dragging=false;const x=pos();if(x>=max*.82){thumb.style.transform=`translateX(${max}px)`;slider.classList.remove("dragging");slider.classList.add("done");slider.querySelector(".vendorPackSliderTrack").textContent="Packing...";await packLiveVendorOrder(slider.dataset.source,slider.dataset.id,thumb)}else reset()};
    thumb.addEventListener("pointerup",finish);thumb.addEventListener("pointercancel",()=>{dragging=false;reset()});
  });
}

window.packLiveVendorOrder=async function(sourceTable,id,btn){
  const idx=vendorLiveOrders.findIndex(o=>o._sourceTable===sourceTable&&String(o.id)===String(id));
  if(idx<0)return;

  const order=vendorLiveOrders[idx];
  btn.disabled=true;

  try{
    // Working reference flow: delivery table FIRST.
    await autoSendToDelivery(order);

    const packedAt=new Date().toISOString();

    // Then original order -> packed, with compatibility retries.
    let result=await sb.from(sourceTable).update({
      order_status:"packed",
      vendor_id:getVendorProductId(),
      vendor_name:currentVendor.vendor_name||"",
      vendor_packed_at:packedAt,
      vendor_packed_id:`${currentVendor.id}-${id}`
    }).eq("id",id).select("*").maybeSingle();

    let packedRow=result.data;
    let error=result.error;

    if(error&&/vendor_name|vendor_packed_at|vendor_packed_id|schema cache|column/i.test(String(error.message||""))){
      result=await sb.from(sourceTable).update({
        order_status:"packed",
        vendor_id:currentVendor.id
      }).eq("id",id).select("*").maybeSingle();
      packedRow=result.data;
      error=result.error;
    }

    if(error&&/vendor_id|schema cache|column/i.test(String(error.message||""))){
      result=await sb.from(sourceTable).update({
        order_status:"packed"
      }).eq("id",id).select("*").maybeSingle();
      packedRow=result.data;
      error=result.error;
    }

    if(error)throw error;

    if(!packedRow||String(packedRow.order_status||"").trim().toLowerCase()!=="packed"){
      throw new Error("Order status was not updated to packed");
    }

    order.order_status="packed";
    vendorAcceptedOrderKeys.delete(vendorLiveOrderKey(order));
    rememberPackedVendorOrder(order);
    vendorLiveOrders.splice(idx,1);
    renderLiveVendorOrders();

  }catch(error){
    console.error("Packed error:",error);
    btn.disabled=false;
    // Show exact Supabase reason if anything still fails.
    alert(error?.message||"Unable to mark packed. Please try again.");
  }
};
